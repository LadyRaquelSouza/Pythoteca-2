name: ARCH-002 build
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  classify:
    runs-on: ubuntu-24.04
    outputs:
      functional: ${{ steps.scope.outputs.functional }}
      documentation: ${{ steps.scope.outputs.documentation }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          functional = documentation = True
          if os.environ["EVENT"] == "pull_request":
              paths = subprocess.check_output(["git", "diff", "--no-renames", "--name-only", "-z", os.environ["BASE"] + "..." + os.environ["HEAD"]]).decode("utf-8").split("\0")
              paths = [p for p in paths if p]
              def doc(p):
                  return p == "README.md" or (p.startswith("docs/") and p.endswith(".md"))
              functional = not paths or any(not doc(p) for p in paths)
              documentation = any(doc(p) for p in paths)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print("functional=" + str(functional).lower(), file=out)
              print("documentation=" + str(documentation).lower(), file=out)
          print(f"functional={functional}, documentation={documentation}")
          PY
  documentation:
    needs: classify
    if: needs.classify.outputs.documentation == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate documentation structure and local Markdown links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          from urllib.parse import unquote, urlsplit
          root = Path.cwd()
          required = ["README.md", "STATUS.md", "history-001.md", "TEMPLATE.md"]
          for name in required:
              assert (root / "docs/development" / name).is_file(), name
          errors = []
          for p in [Path("README.md"), *Path("docs").rglob("*.md")]:
              text = p.read_text(encoding="utf-8")
              if not text.strip():
                  errors.append(f"{p}: empty document")
              text = re.sub(r'(?ms)^ *```.*?^ *```[^\n]*', '', text)
              for link in re.findall(r'\]\(([^\s)]+)\)', text):
                  u = urlsplit(link)
                  if u.scheme or u.netloc or not u.path:
                      continue
                  target = p.parent / unquote(u.path)
                  if not target.exists():
                      errors.append(f"{p}: missing {link}")
          if errors:
              raise SystemExit("\n".join(errors))
          print("DOCUMENTATION_OK")
          PY
  build:
    needs: classify
    if: needs.classify.outputs.functional == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Verify and prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          python3.13 --version
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Verify committed Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -x gradlew
          echo '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046  gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
          grep -Fx 'distributionSha256Sum=f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6' gradle/wrapper/gradle-wrapper.properties
          grep -Fx 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip' gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version
      - name: Compile both debug APKs
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "BUILD_ATTEMPT=$attempt"
            if ./gradlew --no-daemon --stacktrace --info :reader:assembleDebug :executor:assembleDebug :reader:assembleDebugAndroidTest :ipc-test:assembleDebug :ipc-test:assembleDebugAndroidTest 2>&1 | tee /tmp/build-attempt-$attempt.log; then
              exit 0
            fi
            if ! grep -Eq 'Plugin .* was not found|Could not resolve|Could not GET|Could not HEAD' /tmp/build-attempt-$attempt.log; then exit 1; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 30
          done
      - name: Preserve build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-diagnostics
          path: /tmp/build-attempt-*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Inspect package identities and permissions
        shell: bash
        run: |
          set -euo pipefail
          tool="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$tool" dump badging reader/build/outputs/apk/debug/reader-debug.apk
          "$tool" dump badging executor/build/outputs/apk/debug/executor-debug.apk
          "$tool" dump permissions executor/build/outputs/apk/debug/executor-debug.apk > /tmp/executor-permissions
          cat /tmp/executor-permissions
          if grep -q android.permission.INTERNET /tmp/executor-permissions; then exit 1; fi
      - name: Verify native alignment and signatures
        run: bash tests/apk-inspect.sh
      - name: Upload diagnostic APK inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostic-inputs
          path: |
            reader/build/outputs/apk/debug/reader-debug.apk
            executor/build/outputs/apk/debug/executor-debug.apk
            reader/build/outputs/apk/androidTest/debug/reader-debug-androidTest.apk
            ipc-test/build/outputs/apk/debug/ipc-test-debug.apk
            ipc-test/build/outputs/apk/androidTest/debug/ipc-test-debug-androidTest.apk
            gradlew
            gradlew.bat
            gradle/wrapper/
          if-no-files-found: error
          retention-days: 3
  runtime:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: diagnostic-inputs
          path: .
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 IPC smoke test
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tests/ipc-smoke.sh && bash tests/ipc-negative.sh
      - name: Android 15 16KB runtime test
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis_ps16k
          force-avd-creation: true
          disable-animations: true
          script: bash tests/page16k.sh
      - name: Collect tested APKs
        run: |
          mkdir -p dist
          cp reader/build/outputs/apk/debug/reader-debug.apk executor/build/outputs/apk/debug/executor-debug.apk dist/
          printf '%s\n' "$GITHUB_SHA" > dist/TESTED_COMMIT
          (cd dist && sha256sum *.apk > SHA256SUMS)
          mkdir -p dist/wrapper/gradle
          cp gradlew gradlew.bat dist/wrapper/
          cp -r gradle/wrapper dist/wrapper/gradle/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pythoteca-experimental-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  control16k:
    needs: classify
    if: needs.classify.outputs.functional == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [default, strict]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 clean 16KB control
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis_ps16k
          force-avd-creation: true
          disable-animations: true
          script: bash tests/page16k-control.sh ${{ matrix.mode }}

  isolated16k:
    name: isolated16k (${{ matrix.mode }}, ${{ matrix.ram }} MB)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: reader, ram: 2048}
          - {mode: executor, ram: 2048}
          - {mode: both, ram: 2048}
          - {mode: ping, ram: 2048}
          - {mode: python, ram: 2048}
          - {mode: python, ram: 4096}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: diagnostic-inputs
          path: .
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Isolated Android 15 16KB experiment
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis_ps16k
          force-avd-creation: true
          disable-animations: true
          ram-size: ${{ matrix.ram }}M
          script: bash tests/page16k-isolated.sh ${{ matrix.mode }}
      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostics-${{ matrix.mode }}-${{ matrix.ram }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14
