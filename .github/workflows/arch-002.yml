name: ARCH-002 build
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Verify and prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          python3.13 --version
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          curl --fail --silent --show-error --location https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          echo 'f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6  /tmp/gradle.zip' | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Generate and verify Gradle Wrapper
        run: |
          /tmp/gradle-8.11.1/bin/gradle --no-daemon wrapper --gradle-version 8.11.1 --distribution-type bin --gradle-distribution-sha256-sum f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6
          ./gradlew --version
      - name: Compile both debug APKs
        run: ./gradlew --no-daemon :reader:assembleDebug :executor:assembleDebug :reader:assembleDebugAndroidTest :ipc-test:assembleDebug :ipc-test:assembleDebugAndroidTest
      - name: Inspect package identities and permissions
        shell: bash
        run: |
          set -euo pipefail
          tool="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$tool" dump badging reader/build/outputs/apk/debug/reader-debug.apk
          "$tool" dump badging executor/build/outputs/apk/debug/executor-debug.apk
          "$tool" dump permissions executor/build/outputs/apk/debug/executor-debug.apk > /tmp/executor-permissions
          cat /tmp/executor-permissions
          if grep -q android.permission.INTERNET /tmp/executor-permissions; then exit 1; fi
      - name: Verify native alignment and signatures
        run: bash tests/apk-inspect.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 IPC smoke test
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tests/ipc-smoke.sh && bash tests/ipc-negative.sh
      - name: Android 15 16KB runtime test
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis_ps16k
          force-avd-creation: true
          disable-animations: true
          script: bash tests/page16k.sh
      - name: Collect tested APKs
        run: |
          mkdir -p dist
          cp reader/build/outputs/apk/debug/reader-debug.apk executor/build/outputs/apk/debug/executor-debug.apk dist/
          printf '%s\n' "$GITHUB_SHA" > dist/TESTED_COMMIT
          (cd dist && sha256sum *.apk > SHA256SUMS)
          mkdir -p dist/wrapper/gradle
          cp gradlew gradlew.bat dist/wrapper/
          cp -r gradle/wrapper dist/wrapper/gradle/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pythoteca-experimental-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
