name: LANG-002 isolated corpus
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tests/lang/portugol/**'
      - '.github/workflows/lang-002.yml'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Resolve exact candidate packages without lifecycle scripts
        working-directory: tests/lang/portugol
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          npm ls --all --json > dependency-tree.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path("package-lock.json").read_text())
          rows = []
          for path, item in lock["packages"].items():
              if not path:
                  continue
              if not item.get("resolved", "").startswith("https://registry.npmjs.org/") or not item.get("integrity", "").startswith("sha512-"):
                  raise SystemExit("Unexpected origin or missing SHA512: " + path)
              p = Path(path)
              meta = json.loads((p / "package.json").read_text())
              rows.append({"path": path, "version": meta.get("version"), "license": meta.get("license"), "scripts": meta.get("scripts", {}), "notices": sorted(x.name for x in p.iterdir() if x.name.lower().startswith(("license", "notice", "copying"))), "integrity": item["integrity"]})
          Path("dependency-evidence.json").write_text(json.dumps(rows, indent=2) + "\n")
          PY
      - name: Run synthetic corpus in offline restricted container
        run: |
          set -euo pipefail
          root="$PWD/tests/lang/portugol"
          work=$(mktemp -d)
          mkdir "$work/results"
          chmod 777 "$work/results"
          cp "$root"/{corpus.json,run-case.cjs,run-corpus.py} "$work/"
          cp -a "$root/node_modules" "$work/"
          chmod -R a+rX "$work"
          chmod 755 "$work"
          docker pull node:22-bookworm
          image=$(docker image inspect --format '{{index .RepoDigests 0}}' node:22-bookworm)
          printf '%s\n' "$image" > "$work/results/image.txt"
          docker run --rm --network none --read-only --user 1000:1000 --cap-drop ALL \
            --security-opt no-new-privileges:true --memory 512m --memory-swap 512m --cpus 1 \
            --pids-limit 64 --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --mount "type=bind,src=$work,dst=/experiment,readonly" \
            --mount "type=bind,src=$work/results,dst=/results" \
            --workdir /experiment --env HOME=/tmp --entrypoint python3 "$image" run-corpus.py
          cp "$work/results/"* "$root/"
      - name: Preserve corpus evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portugol-corpus-results
          path: |
            tests/lang/portugol/portugol-results.json
            tests/lang/portugol/image.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve resolution for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portugol-dependency-review
          path: |
            tests/lang/portugol/package-lock.json
            tests/lang/portugol/dependency-tree.json
            tests/lang/portugol/dependency-evidence.json
          if-no-files-found: error
          retention-days: 14
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fetch pinned upstream source separately
        run: |
          set -euo pipefail
          upstream=$(mktemp -d)
          git -C "$upstream" init
          git -C "$upstream" fetch --depth 1 https://github.com/erickweil/portugolweb.git 4f150fb9ef58fef7e93ef8ceb8b932093f47f5c5
          test "$(git -C "$upstream" rev-parse FETCH_HEAD)" = 4f150fb9ef58fef7e93ef8ceb8b932093f47f5c5
          work=$(mktemp -d)
          mkdir "$work/upstream" "$work/results" "$work/experiment"
          git -C "$upstream" archive FETCH_HEAD src package.json | tar -x -C "$work/upstream"
          cp tests/lang/portugol/{corpus.json,run-mobile-case.mjs,run-corpus.py} "$work/experiment/"
          chmod -R a+rX "$work"
          chmod 755 "$work"
          chmod 777 "$work/results"
          echo "MOBILE_WORK=$work" >> "$GITHUB_ENV"
      - name: Compare bytecode VM with synthetic corpus offline
        run: |
          set -euo pipefail
          docker pull node:22-bookworm
          image=$(docker image inspect --format '{{index .RepoDigests 0}}' node:22-bookworm)
          printf '%s\n' "$image" > "$MOBILE_WORK/results/image.txt"
          docker run --rm --network none --read-only --user 1000:1000 --cap-drop ALL \
            --security-opt no-new-privileges:true --memory 512m --memory-swap 512m --cpus 1 \
            --pids-limit 64 --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --mount "type=bind,src=$MOBILE_WORK/upstream,dst=/upstream,readonly" \
            --mount "type=bind,src=$MOBILE_WORK/experiment,dst=/experiment,readonly" \
            --mount "type=bind,src=$MOBILE_WORK/results,dst=/results" \
            --workdir /experiment --env HOME=/tmp --entrypoint python3 "$image" run-corpus.py mobile
      - name: Preserve comparative evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portugol-mobile-results
          path: |
            ${{ env.MOBILE_WORK }}/results/mobile-results.json
            ${{ env.MOBILE_WORK }}/results/image.txt
          if-no-files-found: warn
          retention-days: 14
