name: LANG-002 isolated dependency preparation
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tests/lang/portugol/**'
      - '.github/workflows/lang-002.yml'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Resolve exact candidate packages without lifecycle scripts
        working-directory: tests/lang/portugol
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          npm ls --all --json > dependency-tree.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path("package-lock.json").read_text())
          rows = []
          for path, item in lock["packages"].items():
              if not path:
                  continue
              if not item.get("resolved", "").startswith("https://registry.npmjs.org/") or not item.get("integrity", "").startswith("sha512-"):
                  raise SystemExit("Unexpected origin or missing SHA512: " + path)
              p = Path(path)
              meta = json.loads((p / "package.json").read_text())
              rows.append({"path": path, "version": meta.get("version"), "license": meta.get("license"), "scripts": meta.get("scripts", {}), "notices": sorted(x.name for x in p.iterdir() if x.name.lower().startswith(("license", "notice", "copying"))), "integrity": item["integrity"]})
          Path("dependency-evidence.json").write_text(json.dumps(rows, indent=2) + "\n")
          PY
      - name: Preserve resolution for review before executing candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portugol-dependency-review
          path: |
            tests/lang/portugol/package-lock.json
            tests/lang/portugol/dependency-tree.json
            tests/lang/portugol/dependency-evidence.json
          if-no-files-found: error
          retention-days: 14
